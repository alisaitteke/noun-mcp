# Publish server.json to the Official MCP Registry without re-publishing to npm.
# Use when npm is already live but registry metadata is stale. See CONTRIBUTING.md.
name: Publish MCP Registry

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to publish metadata for (e.g. v1.0.4)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Sync server.json with package.json
        run: npm run sync:server-version

      - name: Assert server.json version matches tag
        run: |
          TAG_VERSION="${{ inputs.tag }}"
          TAG_VERSION="${TAG_VERSION#v}"
          SERVER_VERSION="$(node -p "require('./server.json').version")"
          if [[ "$SERVER_VERSION" != "$TAG_VERSION" ]]; then
            echo "server.json version ($SERVER_VERSION) does not match tag ($TAG_VERSION)" >&2
            exit 1
          fi

      - name: Install MCP Publisher
        run: |
          curl -fsSL \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher

      - name: Publish to MCP Registry
        run: |
          TAG_VERSION="${{ inputs.tag }}"
          TAG_VERSION="${TAG_VERSION#v}"
          PKG="$(node -p "require('./package.json').name")"
          for attempt in 1 2 3 4 5 6 7 8; do
            if npm view "${PKG}@${TAG_VERSION}" version >/dev/null 2>&1; then
              echo "${PKG}@${TAG_VERSION} is visible on npm."
              break
            fi
            if [[ "$attempt" -eq 8 ]]; then
              echo "${PKG}@${TAG_VERSION} is not on npm; publish that version first." >&2
              exit 1
            fi
            echo "attempt ${attempt}: ${PKG}@${TAG_VERSION} not visible yet; waiting 15s..."
            sleep 15
          done
          ./mcp-publisher login github-oidc
          for attempt in 1 2 3 4 5; do
            if ./mcp-publisher publish; then
              echo "MCP Registry publish succeeded on attempt ${attempt}."
              exit 0
            fi
            echo "attempt ${attempt} failed; waiting for npm to propagate..."
            sleep $((attempt * 20))
          done
          echo "::error::mcp-publisher publish failed after 5 attempts."
          exit 1
